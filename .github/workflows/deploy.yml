name: Deploy Strapi to Windows Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Deploy
        run: |
          $project = "F:\my-strapi-project"
          $nssm = "C:\Users\Aamir\nssm-2.24\nssm-2.24\win64\nssm.exe"

          Write-Host "===== Starting Deployment ====="

          cd $project

          Write-Host "Fetching latest code..."
          git fetch origin

          Write-Host "Resetting to latest commit..."
          git reset --hard origin/master

          Write-Host "Cleaning untracked files..."
          git clean -fd

          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Building Strapi..."
          npm run build

          Write-Host "Restarting Strapi..."
          & $nssm restart StrapiCMS

          Write-Host "Waiting for Strapi..."
          Start-Sleep -Seconds 10

          try {
              $response = Invoke-WebRequest http://localhost:1337/admin -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                  Write-Host "✅ Deployment Successful"
              } else {
                  throw "Health check failed."
              }
          }
          catch {
              Write-Error $_
              exit 1
          }
